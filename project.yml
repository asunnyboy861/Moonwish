name: Moonwish
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Moonwish:
    type: application
    platform: iOS
    sources:
      - path: Moonwish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Moonwish
        PRODUCT_NAME: Moonwish
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Moonwish/Info.plist
        CODE_SIGN_ENTITLEMENTS: Moonwish/Moonwish.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: GLMProxySecret.txt
  MoonwishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoonwishTests
    dependencies:
      - target: Moonwish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.MoonwishTests
        GENERATE_INFOPLIST_FILE: YES
